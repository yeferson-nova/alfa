[tox]
envlist = py39,py310,py311,py312
skipsdist = True

[testenv]
deps =
    pytest
    pytest-cov
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    pytest tests

[pytest]
testpath = tests
pythonpath = src
addopts = -v -p no:warnings --junitxml=reports/junit_report.xml
          --cov=src
          --cov-config=tox.ini 
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml 
          --cov-report=html:reports/htmlcov
          --cov-fail-under=70

[coverage:run]
relative_files = True
branch = False
omit = 
    **/__init__.py
    **/tests/*

[coverage:report]
fail_under = 70

[testenv:clean]
deps = coverage
skip_install = false
commands = coverage erase
