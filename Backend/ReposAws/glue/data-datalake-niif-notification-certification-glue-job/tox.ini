[tox]
envlist = py38,py310
skipsdist = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    python3 -m pytest tests
    
[pytest]
addopts = -v -p no:warnings --junitxml=reports/junit_report.xml
          --cov=src
          --cov-config=tox.ini 
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml 
          --cov-report=html:reports/htmlcov
          --cov-fail-under=0

[coverage:run]
relative_files = True
branch = False
omit = 
    **/__init__.py
    **/tests/*
    src/**.py

[coverage:report]
fail_under = 0

[testenv:clean]
deps = coverage
skip_install = false
commands = coverage erase
