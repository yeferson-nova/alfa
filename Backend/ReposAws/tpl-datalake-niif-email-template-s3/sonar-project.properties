# Identificación del Proyecto
sonar.projectKey=tpl-datalake-niif-email-template-s3
sonar.projectName=alfa-analitica/tpl-datalake-niif-email-template-s3

# Analizamos solo la carpeta src donde están los .json y .html
sonar.sources=src/
sonar.sourceEncoding=UTF-8

# pruebas cobertura
sonar.tests=
sonar.test.exclusions=**/*
sonar.cpd.exclusions=**/*


# Excluimos cualquier residuo de Python o carpetas ocultas del sistema
sonar.exclusions=**/*.py, **/__pycache__/**, **/venv/**, **/.venv/**, **/.DS_Store, src/email-template/**

#detecta varios lenguajes
sonar.language=