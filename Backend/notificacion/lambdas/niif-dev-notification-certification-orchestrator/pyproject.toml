[project]
name = "niif-dev-notification-certification-orchestrator"
version = "1.0.0"
description = "Lambda que orquesta la cadena de notificacion y certificacion NIIF 17 desde el stream de DynamoDB"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "boto3>=1.34", "tzdata>=2024.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "test"]
testpaths = ["test"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["certification_orchestrator", "niif_observability"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
