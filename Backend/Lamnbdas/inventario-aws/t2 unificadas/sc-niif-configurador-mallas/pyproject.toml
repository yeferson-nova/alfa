[project]
name = "sc-niif-configurador-mallas"
version = "1.1.0"
description = "Lambda general que configura las mallas NIIF 17 (reemplaza a las 6 configuration-<malla>)"
requires-python = ">=3.12"
dependencies = []  # boto3 viene en el runtime de Lambda

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["configurador_mallas"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
