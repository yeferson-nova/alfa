[project]
name = "configurador-niif17"
version = "0.1.0"
description = "Configurador de mallas NIIF 17 (spike: Primas Rentas)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]          # en Lambda ya viene incluido en el runtime
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
